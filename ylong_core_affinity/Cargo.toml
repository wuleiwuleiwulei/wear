[package]
name = "ylong_core_affinity"
version = "1.25.10"
authors = ["z00355984 <zhouzipeng@huawei.com>"]
edition = "2021"
description = "set the cpu for the current thread to be bound to cores"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://open.codehub.huawei.com/innersource/Ylong_Rust/ylong_rs/files?ref=master&filePath=src%2Flib%2Futil%2Fylong_core_affinity"
keywords = ["ylong", "core", "affinity", "cpu"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ylong_num_cpus = {path = "../ylong_num_cpus", version = "1.25.10", registry = "product_cargo" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.153"
